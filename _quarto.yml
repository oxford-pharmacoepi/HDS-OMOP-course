project:
  type: website
  output-dir: _site
  pre-render: Rscript Downloads/generateFiles.R

date: today

website:
  title: "HDS-OMOP-course"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  repo-url: https://github.com/oxford-pharmacoepi/HDS-OMOP-course
  repo-actions: [issue]
  navbar:
    right:
      - text: "Downloads"
        href: Downloads/index.qmd
  page-footer:
    center: "Rendered on {{< meta date >}}"
    right:
      - href: https://github.com/oxford-pharmacoepi/HDS-OMOP-course
        icon: github
      - href: https://www.youtube.com/@oxinfer
        icon: youtube

format:
  html:
    toc: true
    theme: cosmo
    search: false
